<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Trânsito na Lei · Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
/* Layout: sticky header with route tabs; dashboard = agenda column + side rail; drawer slides from the right for every record. */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f5f7fa; --ink:#18202b; --muted:#5b6777; --line:#d3dae3;
  --accent:#e9a600; --accent-ink:#1b1400; --blue:#0b3a9e;
  --ok:#1d7a4b; --ok-bg:#e1f2e8; --warn:#9a5c00; --warn-bg:#fdf0d6; --bad:#b8322a; --bad-bg:#fbe3e0;
  --info:#2453b3; --info-bg:#e2eafb; --check:#6d3fb0; --check-bg:#efe6fb; --neutral-bg:#e8ecf1;
  --plate-bg:#ffffff; --plate-ink:#121417; --plate-band:#0b3a9e;
  --shadow:0 10px 30px rgba(15,25,40,.18);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151b; --surface:#1a2029; --surface-2:#151a22; --ink:#e6eaf0; --muted:#98a4b4; --line:#2c3543;
  --accent:#f2b521; --accent-ink:#1b1400; --blue:#6f97ff;
  --ok:#4cc38a; --ok-bg:#16301f; --warn:#f0b04a; --warn-bg:#33270f; --bad:#f2786d; --bad-bg:#3a1a18;
  --info:#7ea2f5; --info-bg:#18243f; --check:#b994f0; --check-bg:#2a1f3d; --neutral-bg:#242c37;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151b; --surface:#1a2029; --surface-2:#151a22; --ink:#e6eaf0; --muted:#98a4b4; --line:#2c3543;
  --accent:#f2b521; --accent-ink:#1b1400; --blue:#6f97ff;
  --ok:#4cc38a; --ok-bg:#16301f; --warn:#f0b04a; --warn-bg:#33270f; --bad:#f2786d; --bad-bg:#3a1a18;
  --info:#7ea2f5; --info-bg:#18243f; --check:#b994f0; --check-bg:#2a1f3d; --neutral-bg:#242c37;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.login{max-width:380px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.login .panel{gap:14px}
.login .err{color:var(--bad);font-size:13px;font-weight:600}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sign{width:34px;height:34px;flex:none;background:var(--accent);transform:rotate(45deg);border-radius:5px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--accent-ink)}
.sign span{transform:rotate(-45deg);font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--accent-ink);letter-spacing:.02em}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.01em;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.brand .sp{flex:1}
.today{font-size:12px;color:var(--muted);text-align:right}
.today b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;letter-spacing:.02em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:9px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;color:var(--muted);font-size:13.5px}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;margin-left:5px;vertical-align:1px}

main{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.02em;margin:0;text-transform:uppercase;color:var(--muted)}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head .sp{flex:1}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--tc,var(--line));text-align:left;cursor:pointer}
.tile:hover{border-color:var(--muted);border-top-color:var(--tc,var(--line))}
.tile b{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tile.zero b{color:var(--muted)}
@media (max-width:900px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile b{font-size:28px}}

/* dashboard layout */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:960px){.dash{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.group{display:flex;flex-direction:column;gap:6px}
.group-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gc,var(--muted));padding-top:6px}
.group-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* deadline row */
.row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--rc,var(--line));border-radius:8px;padding:9px 12px 9px 10px;cursor:pointer}
.row:hover{border-color:var(--muted);border-left-color:var(--rc,var(--line))}
.date{display:flex;flex-direction:column;align-items:center;line-height:1}
.date b{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.date small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.rbody{min-width:0;display:flex;flex-direction:column;gap:3px}
.l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.l2{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.dleft{font-size:12px;font-weight:700;color:var(--rc,var(--muted));white-space:nowrap}
@media (max-width:560px){.row{grid-template-columns:52px minmax(0,1fr)}.rside{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap}}

/* plate (Mercosul) */
.plate{display:inline-flex;flex-direction:column;background:var(--plate-bg);color:var(--plate-ink);border:1.5px solid var(--plate-ink);border-radius:4px;overflow:hidden;line-height:1;vertical-align:middle;flex:none}
.plate::before{content:"BRASIL";display:block;background:var(--plate-band);color:#fff;font-size:5.5px;letter-spacing:.2em;text-align:center;padding:1px 0;font-family:var(--f-body);font-weight:700}
.plate span{font-family:var(--f-mono);font-weight:600;font-size:12px;padding:2px 6px 3px;letter-spacing:.06em}
.plate.big span{font-size:18px;padding:3px 10px 5px}
.plate.big::before{font-size:7px}
.ait{font-family:var(--f-mono);font-weight:600;font-size:13px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--pb,var(--neutral-bg));color:var(--pc,var(--muted))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-a_fazer{--pb:var(--warn-bg);--pc:var(--warn)}
.p-redigido{--pb:var(--info-bg);--pc:var(--info)}
.p-protocolado{--pb:var(--neutral-bg);--pc:var(--ink)}
.p-deferido{--pb:var(--ok-bg);--pc:var(--ok)}
.p-indeferido{--pb:var(--bad-bg);--pc:var(--bad)}
.p-nao_recorrer{--pb:var(--neutral-bg);--pc:var(--muted)}
.p-conferir{--pb:var(--check-bg);--pc:var(--check)}
.tag{display:inline-block;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.tag.strong{color:var(--ink)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td .muted{color:var(--muted);font-size:12px}
.clip{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=email],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
select{cursor:pointer}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.hint{font-size:12px;color:var(--muted)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;min-width:0}
.card:hover{border-color:var(--muted)}
.card h4{margin:0;font-size:15px;font-weight:700;line-height:1.3}
.card p{margin:0;font-size:13px;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
.stats b{color:var(--ink);font-family:var(--f-mono);font-size:13px}
.stats .red b{color:var(--bad)}

.empty{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--ink);font-size:15px}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600}
.mini{display:flex;flex-direction:column;gap:6px}
.mini button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 0;cursor:pointer;min-width:0}
.mini button:last-child{border-bottom:0}
.mini .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.money-line{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.money-line b{font-family:var(--f-mono)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,22,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.dr-h h2{font-size:20px;flex:1;min-width:0}
.dr-b{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.dr-f{display:flex;gap:8px;align-items:center;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap}
.dr-f .sp{flex:1}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
.fase{border:1px solid var(--line);border-left:4px solid var(--fc,var(--line));border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.fase-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fase-h .n{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--muted)}
.fname{display:flex;gap:6px;align-items:center}
.fname code{flex:1;min-width:0;font-family:var(--f-mono);font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;overflow-x:auto;white-space:nowrap}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
@media (max-width:520px){.checks{grid-template-columns:minmax(0,1fr)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:40;font-size:13px;max-width:calc(100% - 32px)}
.detail-h{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.detail-h .info{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
textarea.report{font-family:var(--f-mono);font-size:12px;min-height:220px}
.nextd{display:flex;flex-direction:column;gap:1px;border-left:4px solid var(--rc,var(--line));padding:4px 0 4px 10px}
.nextd span{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.nextd b{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.nextd em{font-style:normal;font-size:12px;color:var(--rc,var(--muted));font-weight:600}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.crumbs b{color:var(--ink);padding:0 6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.linkbtn{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.linkbtn:hover{text-decoration-color:currentColor}
/* files */
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--warn-bg)}
.drop-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop-row select{flex:1 1 200px;width:auto}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ftype{font-family:var(--f-mono);font-size:10.5px;font-weight:600;text-align:center;border-radius:5px;padding:6px 0;background:var(--neutral-bg);color:var(--muted);text-transform:uppercase}
.ftype.pdf{background:var(--bad-bg);color:var(--bad)}.ftype.img{background:var(--ok-bg);color:var(--ok)}.ftype.doc{background:var(--info-bg);color:var(--info)}.ftype.xls{background:var(--ok-bg);color:var(--ok)}
.fmeta{min-width:0;display:flex;flex-direction:column;gap:1px}
.fmeta b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta span{font-size:11.5px;color:var(--muted)}
.facts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
a.btn{text-decoration:none}
@media (max-width:520px){.file{grid-template-columns:40px minmax(0,1fr)}.facts{grid-column:1/-1;justify-content:flex-start}}
.meter{height:6px;border-radius:3px;background:var(--neutral-bg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">
    <div class="sign" aria-hidden="true"><span>TL</span></div>
    <div><h1>Trânsito na Lei</h1><small>Prazos, autos, teses e honorários do escritório</small></div>
    <div class="sp"></div>
    <div class="today" id="today"></div><div class="who" id="who" hidden><span id="who-mail"></span><button class="btn sm" data-act="logout">Sair</button></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Seções"></nav>
</div></header>
<main id="app"></main>
<div id="drawer-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const COLS=["clientes","autos","teses","equipamentos","contratos"];
const S={}; COLS.forEach(c=>S[c]=new Map());
const loaded=new Set();
let db=null, dbState="loading", downloads=null, assets=null, usage=null, busy=false, sb=null, session=null, booted=false;
const CFG=window.TL_CONFIG||{};
const BUCKET="arquivos";
function makeDb(client){
  const cache={};
  return {collection(c){
    cache[c]=cache[c]||new Map();const m=cache[c];

    const by=new Map();withD.forEach(x=>{const k=x.a.clienteId||"";if(!by.has(k))by.set(k,[]);by.get(k).push(x)});
    [...by.entries()].sort((a,b)=>a[1][0].d-b[1][0].d).forEach(([cid,it])=>{const col=dColor(it[0].d);ag+='<div class="group"><div class="group-h" style="--gc:'+col+'"><button class="linkbtn" data-act="open-cliente" data-id="'+esc(cid)+'">'+esc(cname(cid))+"</button> · "+it.length+(it.length===1?" prazo":" prazos")+"</div>"+it.map(deadlineRow).join("")+"</div>"});
  } else groups.forEach(([t,fn,col])=>{const it=withD.filter(fn);if(it.length)ag+='<div class="group"><div class="group-h" style="--gc:'+col+'">'+t+" · "+it.length+"</div>"+it.map(deadlineRow).join("")+"</div>"});
  if(!ag) ag='<div class="empty"><b>Nenhum prazo em aberto</b>Cadastre um auto com a data-limite da defesa ou do recurso e ele aparece aqui.</div>';
  const sem=p.filter(x=>x.d==null);
  const conf=[];for(const a of S.autos.values())(a.fases||[]).forEach(f=>{if(f.status==="conferir")conf.push({a,f})});
  conf.sort((x,y)=>(y.f.prazo||"").localeCompare(x.f.prazo||""));
  const ct=arr(S.contratos).map(k=>({k,...contratoCalc(k)}));const receber=ct.reduce((s,x)=>s+Math.max(0,x.saldo),0);const atras=ct.filter(x=>x.st==="atrasado");
  let side='<div class="panel"><h3>Sem prazo cadastrado</h3>'+(sem.length?'<div class="mini">'+sem.map(x=>'<button data-act="open-auto" data-id="'+esc(x.a.id)+'">'+plate(x.a.placa)+'<span class="t">'+esc(cname(x.a.clienteId))+" · "+esc(x.f.tipo)+"</span>"+pill(x.f.status)+"</button>").join("")+"</div>":'<p class="hint">Todos os pendentes têm data-limite.</p>')+"</div>";
  side+='<div class="panel"><h3>A conferir · '+conf.length+'</h3><p class="hint">Autos importados ou com situação incerta. Confirme o que foi feito e atualize o status.</p>'+(conf.length?'<div class="mini">'+conf.slice(0,6).map(x=>'<button data-act="open-auto" data-id="'+esc(x.a.id)+'">'+plate(x.a.placa)+'<span class="t"><span class="ait">'+esc(x.a.ait)+"</span> · "+esc(cname(x.a.clienteId))+'</span><span class="hint">'+fmtDM(x.f.prazo)+"</span></button>").join("")+'</div><button class="btn sm" data-act="tile" data-k="conferir">Ver todos</button>':"")+"</div>";
  side+='<div class="panel"><h3>Honorários</h3>'+(ct.length?'<div class="money-line"><span>A receber</span><b>'+money(receber)+'</b></div><div class="money-line"><span>Contratos atrasados</span><b style="color:'+(atras.length?"var(--bad)":"inherit")+'">'+atras.length+'</b></div><button class="btn sm" data-act="view" data-v="financeiro">Abrir honorários</button>':'<p class="hint">Nenhum contrato cadastrado ainda.</p><button class="btn sm" data-act="new-contrato">+ Cadastrar contrato</button>')+"</div>";
  return h+'<div class="dash"><div class="panel">'+ag+'</div><div style="display:flex;flex-direction:column;gap:14px;min-width:0">'+side+"</div></div>";
}

function autoTable(list,showCliente){
  if(!list.length) return '<div class="empty"><b>Nenhum auto encontrado</b>Ajuste os filtros ou cadastre um novo auto.</div>';
  list.sort((x,y)=>{const fx=faseAtual(x).f,fy=faseAtual(y).f;return ((fx&&fx.prazo)||"9999").localeCompare((fy&&fy.prazo)||"9999")});
  return '<div class="tbl-wrap"><table><thead><tr><th>Placa</th><th>AIT</th>'+(showCliente?"<th>Cliente</th>":"")+'<th>Órgão</th><th>Infração</th><th class="r">Valor</th><th>Fase atual</th><th>Prazo</th><th>Status</th></tr></thead><tbody>'+
  list.map(a=>{const {f}=faseAtual(a);const d=f?daysUntil(f.prazo):null;const pend=f&&isPend(f,a);
    return '<tr data-act="open-auto" data-id="'+esc(a.id)+'"><td>'+plate(a.placa)+'</td><td class="ait">'+esc(a.ait)+(a.condutor?'<div class="muted">Condutor: '+esc(a.condutor)+"</div>":"")+"</td>"+(showCliente?'<td class="clip">'+esc(cname(a.clienteId))+"</td>":"")+"<td>"+esc(a.orgao)+'</td><td class="clip" title="'+esc(a.descricao)+'">'+(a.codigo?'<span class="mono">'+esc(a.codigo)+"</span> ":"")+esc(a.descricao)+'</td><td class="r num">'+(a.valor?money(a.valor):"—")+"</td><td>"+(f?esc(f.tipo):"—")+'</td><td class="num" style="white-space:nowrap">'+(f&&f.prazo?fmtD(f.prazo)+(pend?'<div class="muted" style="color:'+dColor(d)+'">'+dLabel(d)+"</div>":""):"—")+"</td><td>"+(f?pill(f.status):"")+"</td></tr>"}).join("")+"</tbody></table></div>";
}

    if(!ui.encerrados&&!ui.status&&encerrado(a))return false;

  '<select id="f-org" data-ui="orgao" aria-label="Órgão" style="width:auto"><option value="">Todos os órgãos</option>'+orgs.map(o=>'<option'+(ui.orgao===o?" selected":"")+">"+esc(o)+"</option>").join("")+"</select>"+
  '<label class="chk"><input type="checkbox" id="f-enc" data-ui="encerrados"'+(ui.encerrados?" checked":"")+"> Mostrar encerrados</label></div>"+autoTable(list,true);

function vStats(au){let pend=0,venc=0,prox=null,proxF=null,conf=0,cond=0,aberto=0;
  au.forEach(a=>{if(a.condutor)cond++;if(!encerrado(a))aberto+=Number(a.valor)||0;(a.fases||[]).forEach(f=>{if(f.status==="conferir")conf++;if(isPend(f,a)){pend++;const d=daysUntil(f.prazo);if(d!=null){if(d<0)venc++;if(prox==null||d<prox){prox=d;proxF=f}}}})});
  return{pend,venc,prox,proxF,conf,cond,aberto,total:au.reduce((s,a)=>s+(Number(a.valor)||0),0)}}
function veiculosDo(cid){const m=new Map();
  arr(S.autos).filter(a=>a.clienteId===cid).forEach(a=>{const k=a.placa||"";if(!m.has(k))m.set(k,{placa:k,modelo:"",proprietario:"",autos:[]});const v=m.get(k);v.autos.push(a);if(!v.modelo&&a.modelo)v.modelo=a.modelo;if(!v.proprietario&&a.proprietario)v.proprietario=a.proprietario});
  return [...m.values()].map(v=>Object.assign(v,vStats(v.autos))).sort((x,y)=>((x.prox==null?1e9:x.prox)-(y.prox==null?1e9:y.prox))||x.placa.localeCompare(y.placa))}
function pendList(au,emptyMsg){
  const it=[];au.forEach(a=>(a.fases||[]).forEach((f,i)=>{if(isPend(f,a))it.push({a,f,i,d:daysUntil(f.prazo)})}));
  it.sort((x,y)=>(x.d==null?1e9:x.d)-(y.d==null?1e9:y.d));
  return it.length?'<div class="group">'+it.map(deadlineRow).join("")+"</div>":'<p class="hint">'+emptyMsg+"</p>";
}
function miniTiles(list){return '<div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">'+list.map(t=>'<div class="tile'+(t[1]?"":" zero")+'" style="--tc:'+t[2]+';cursor:default"><b'+(t[3]?' style="font-size:24px"':"")+">"+t[1]+"</b><span>"+t[0]+"</span></div>").join("")+"</div>"}
function nextBadge(v){
  if(v.prox==null)return '<div class="nextd" style="--rc:var(--line)"><span>Próximo prazo</span><b>—</b><em>'+(v.pend?"pendência sem data":"nada pendente")+"</em></div>";
  return '<div class="nextd" style="--rc:'+dColor(v.prox)+'"><span>Próximo prazo</span><b>'+fmtD(v.proxF.prazo)+"</b><em>"+esc(v.proxF.tipo)+" · "+dLabel(v.prox)+"</em></div>";
}

  if(ui.clienteSel&&S.clientes.has(ui.clienteSel)){const c=S.clientes.get(ui.clienteSel);return ui.placaSel!=null?vVeiculo(c,ui.placaSel):vCliente(c)}

function resumoCliente(c){
  const au=arr(S.autos).filter(a=>a.clienteId===c.id);const by={};au.forEach(a=>{(by[a.placa||"Sem placa"]=by[a.placa||"Sem placa"]||[]).push(a)});
  let t="Resumo dos autos de trânsito – "+c.nome+"\nAtualizado em "+fmtD(todayISO())+"\n";
  Object.keys(by).sort().forEach(p=>{t+="\nPlaca "+p+(by[p][0].modelo?" ("+by[p][0].modelo+")":"")+"\n";by[p].forEach(a=>{const {f}=faseAtual(a);t+="• AIT "+(a.ait||"s/n")+" – "+(a.orgao||"")+(a.descricao?" – "+a.descricao:"")+(a.valor?" – "+money(a.valor):"")+"\n   "+(f?f.tipo+": "+(STATUS[f.status]||f.status)+(f.prazo?" (prazo "+fmtD(f.prazo)+")":""):"sem fase")+(a.condutor?"\n   Condutor identificado: "+a.condutor:"")+"\n"})});
  const ci=au.filter(a=>a.condutor);
  if(ci.length){t+="\nMultas com condutor identificado (responsabilidade do motorista):\n";ci.forEach(a=>{t+="• "+a.condutor+" – AIT "+a.ait+" – placa "+a.placa+" – "+(a.descricao||"")+(a.valor?" – "+money(a.valor):"")+"\n"})}
  return t;
}
function crumbs(c,v){return '<nav class="crumbs" aria-label="Caminho"><button class="btn ghost sm" data-act="back-clientes">Clientes</button><span>›</span>'+(v!=null?'<button class="btn ghost sm" data-act="back-cliente">'+esc(c.nome)+"</button><span>›</span><b>"+esc(v||"Sem placa")+"</b>":"<b>"+esc(c.nome)+"</b>")+"</nav>"}

  h+=miniTiles([["Veículos",vs.length,"var(--info)"],["Autos",au.length,"var(--line)"],["Prazos pendentes",st.pend,"var(--warn)"],["Vencidos",st.venc,"var(--bad)"],["A conferir",st.conf,"var(--check)"]]);
  h+='<div class="head"><div><h2>Veículos</h2><p class="sub">Abra um veículo para ver todas as multas e prazos daquela placa.</p></div></div>';

  h+='<div class="panel"><h3>Todos os prazos do cliente · '+st.pend+"</h3>"+pendList(au,"Nenhum prazo pendente para este cliente.")+"</div>";
  h+='<div class="head"><h3>Honorários</h3><div class="sp"></div><button class="btn sm" data-act="new-contrato" data-cli="'+esc(c.id)+'">+ Contrato</button></div>'+(ks.length?contratoTable(ks,false):'<p class="hint">Nenhum contrato para este cliente.</p>');
  const txt=resumoCliente(c);

  auto:()=>({ait:"",clienteId:"",placa:"",modelo:"",proprietario:"",orgao:"",codigo:"",descricao:"",dataInfracao:"",local:"",valor:"",condutor:"",escopo:"completo",equipamentoId:"",teseIds:[],fases:[{tipo:"Defesa prévia",prazo:"",status:"a_fazer",obs:"",protocolo:""}],docs:{},obs:""}),

};
const COLL={auto:"autos",cliente:"clientes",tese:"teses",equip:"equipamentos",contrato:"contratos"};

async function save(){
  const k=drawer.kind,d=drawer.draft;const col=COLL[k];
  if(k==="auto"){
    d.placa=String(d.placa||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(!d.clienteId){toast("Escolha o cliente");return}
    if(!d.ait&&!d.placa){toast("Informe o nº do AIT ou a placa");return}
    d.valor=Number(String(d.valor).replace(",","."))||0;
  }
  if(k==="cliente"&&!d.nome.trim()){toast("Informe o nome do cliente");return}
  if(k==="tese"&&!d.titulo.trim()){toast("Informe o título da tese");return}
  if(k==="equip"&&!d.serie.trim()){toast("Informe o nº de série");return}
  if(k==="contrato"){if(!d.clienteId){toast("Escolha o cliente");return}d.valor=Number(String(d.valor).replace(",","."))||0;d.pagamentos=d.pagamentos.map(p=>({data:p.data,valor:Number(String(p.valor).replace(",","."))||0}))}
  const id=d.id||newId(col);const body=Object.assign({},d);delete body.id;
  const now=new Date().toISOString();body.atualizadoEm=now;if(!body.criadoEm)body.criadoEm=now;
  const btn=$('[data-act="save"]');if(btn){btn.disabled=true;btn.textContent="Salvando…"}
  try{await db.collection(col).doc(id).set(body);closeDrawer();toast("Salvo")}
  catch(e){if(btn){btn.disabled=false;btn.textContent="Salvar"}toast(e&&e.code==="invalid_argument"?"Sem permissão para salvar. Seu e-mail precisa estar cadastrado na equipe.":"Não foi possível salvar: "+((e&&e.message)||"erro"))}
}
async function del(){
  const k=drawer.kind,d=drawer.draft;
  const fs=(S[COLL[k]].get(d.id)||d).arquivos||[];
  try{await db.collection(COLL[k]).doc(d.id).delete();closeDrawer();toast("Excluído");if(assets)for(const f of fs){try{await assets.delete(f.id)}catch(_){}}refreshUsage()}catch(e){toast("Não foi possível excluir: "+((e&&e.message)||"erro"))}
}

async function exportCSV(){
  const rows=[["Cliente","Placa","Modelo","AIT","Órgão","Código","Descrição","Data infração","Valor","Condutor identificado","Escopo","Fase","Data-limite","Status","Protocolo","Observação da fase"]];
  arr(S.autos).forEach(a=>(a.fases&&a.fases.length?a.fases:[{}]).forEach(f=>rows.push([cname(a.clienteId),a.placa,a.modelo,a.ait,a.orgao,a.codigo,a.descricao,fmtD(a.dataInfracao),String(a.valor||0).replace(".",","),a.condutor,ESC_TAG[a.escopo]||"",f.tipo||"",f.prazo?fmtD(f.prazo):"",STATUS[f.status]||"",f.protocolo||"",f.obs||""])));
  const csv="﻿"+rows.map(r=>r.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(";")).join("\r\n");
  
  try{const r=await downloads.save({filename:"autos-transito-"+todayISO()+".csv",data:csv});if(r&&r.status==="saved")toast("Planilha exportada")}catch(e){if(e&&e.code!=="cancelled")toast("Exportação não concluída")}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const act=el.dataset.act,id=el.dataset.id;
  switch(act){
    case "view":view=el.dataset.v;ui.clienteSel=null;ui.placaSel=null;try{history.replaceState(null,"","#"+view)}catch(_){}closeDrawer();render();window.scrollTo(0,0);break;
    case "tile":{const kk=el.dataset.k;if(kk==="conferir"||kk==="protocolado"){Object.assign(ui,{status:kk,q:"",cliente:"",orgao:""});view="autos";render()}else{const g=document.querySelector(".group");if(g)g.scrollIntoView({behavior:"smooth",block:"start"})}break}
    case "open-auto":{const a=S.autos.get(id);if(a)openDrawer("auto",Object.assign(BLANK.auto(),a,{id}),false);break}
    case "new-auto":{const b=BLANK.auto();if(el.dataset.cli){b.clienteId=el.dataset.cli;const c=cliente(el.dataset.cli);if(c)b.proprietario=c.nome}
      if(el.dataset.placa!=null&&el.dataset.cli){const v=veiculosDo(el.dataset.cli).find(x=>x.placa===el.dataset.placa);b.placa=el.dataset.placa;if(v){b.modelo=v.modelo;if(v.proprietario)b.proprietario=v.proprietario}}
      openDrawer("auto",b,true);break}
    case "open-cliente":ui.clienteSel=id;ui.placaSel=null;if(view!=="clientes"){view="clientes";try{history.replaceState(null,"","#clientes")}catch(_){}}closeDrawer();render();window.scrollTo(0,0);break;
    case "open-veic":ui.placaSel=el.dataset.placa||"";render();window.scrollTo(0,0);break;
    case "back-cliente":ui.placaSel=null;render();window.scrollTo(0,0);break;
    case "agrupar":ui.agrupar=el.dataset.g;try{localStorage.setItem("tl-agrupar",ui.agrupar)}catch(_){}render();break;
    case "back-clientes":ui.clienteSel=null;ui.placaSel=null;render();window.scrollTo(0,0);break;
    case "new-cliente":openDrawer("cliente",BLANK.cliente(),true);break;
    case "edit-cliente":openDrawer("cliente",Object.assign(BLANK.cliente(),S.clientes.get(id),{id}),false);break;
    case "new-tese":openDrawer("tese",BLANK.tese(),true);break;
    case "edit-tese":openDrawer("tese",Object.assign(BLANK.tese(),S.teses.get(id),{id}),false);break;
    case "new-equip":openDrawer("equip",BLANK.equip(),true);break;
    case "edit-equip":openDrawer("equip",Object.assign(BLANK.equip(),S.equipamentos.get(id),{id}),false);break;
    case "new-contrato":{const b=BLANK.contrato();if(el.dataset.cli)b.clienteId=el.dataset.cli;openDrawer("contrato",b,true);break}
    case "edit-contrato":openDrawer("contrato",Object.assign(BLANK.contrato(),S.contratos.get(id),{id}),false);break;
    case "copy-resumo":{const c=S.clientes.get(id);if(c)copy(resumoCliente(c));break}
    case "export":exportCSV();break;
    case "close":closeDrawer();break;
    case "save":save();break;
    case "del-ask":drawer.confirmDel=true;renderDrawer();break;
    case "del-cancel":drawer.confirmDel=false;renderDrawer();break;
    case "del-confirm":del();break;
    case "add-fase":{const fs=drawer.draft.fases;const last=fs[fs.length-1];fs.push({tipo:last&&NEXT[last.tipo]||"Defesa prévia",prazo:"",status:"a_fazer",obs:"",protocolo:""});renderDrawer();break}
    case "del-fase":drawer.draft.fases.splice(+el.dataset.i,1);renderDrawer();break;
    case "next-fase":{const f=drawer.draft.fases[+el.dataset.i];drawer.draft.fases.push({tipo:NEXT[f.tipo],prazo:"",status:"a_fazer",obs:"",protocolo:""});renderDrawer();toast("Fase aberta: informe a data-limite");break}
    case "copy-name":copy(fileName(drawer.draft,drawer.draft.fases[+el.dataset.i]));break;
    case "file-dl":baixar(el.dataset.fid);break;
    case "file-open":abrir(el.dataset.fid);break;
    case "logout":sb.auth.signOut();break;
    case "do-reset":sendReset();break;
    case "file-del-ask":ui.delFile=el.dataset.fid;render();renderDrawer();break;
    case "file-del-cancel":ui.delFile="";render();renderDrawer();break;
    case "file-del":removeFile(el.dataset.kind,el.dataset.own,el.dataset.fid);break;
    case "files-of":Object.assign(ui,{fcli:id,fcat:"",fq:"",arqCli:id,arqAuto:""});view="arquivos";try{history.replaceState(null,"","#arquivos")}catch(_){}closeDrawer();render();window.scrollTo(0,0);break;
    case "add-pag":drawer.draft.pagamentos.push({data:todayISO(),valor:""});renderDrawer();break;
    case "del-pag":drawer.draft.pagamentos.splice(+el.dataset.i,1);renderDrawer();break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.upload)return;
  if(t.dataset.ui){ui[t.dataset.ui]=t.type==="checkbox"?t.checked:t.value;if(t.dataset.ui==="arqCli")ui.arqAuto="";render();return}
  if(!drawer)return;
  if(t.dataset.f){setPath(drawer.draft,t.dataset.f,t.value);
    if(t.tagName==="SELECT"||/^(placa|ait|modelo|orgao|escopo)$/.test(t.dataset.f)||/\.(status|prazo|tipo)$/.test(t.dataset.f)){refreshDrawerBits()}
    return}
  if(t.dataset.tese){const s=new Set(drawer.draft.teseIds||[]);t.checked?s.add(t.dataset.tese):s.delete(t.dataset.tese);drawer.draft.teseIds=[...s];return}
  if(t.dataset.doc){drawer.draft.docs=Object.assign({},drawer.draft.docs,{[t.dataset.doc]:t.checked});return}
});
function catOf(el){const s=document.getElementById(el.dataset.catsel);return s?s.value:"Outro"}
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.upload){const[k,id]=t.dataset.upload.split("|");const files=Array.from(t.files||[]);t.value="";addFiles(k,id,files,catOf(t))}});
let dragEl=null;
const hasFiles=e=>e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes("Files");
document.addEventListener("dragover",e=>{const z=e.target.closest&&e.target.closest("[data-drop]");if(!z){if(hasFiles(e))e.preventDefault();return}e.preventDefault();if(dragEl!==z){if(dragEl)dragEl.classList.remove("over");dragEl=z;z.classList.add("over")}});
document.addEventListener("dragleave",e=>{const z=e.target.closest&&e.target.closest("[data-drop]");if(z&&!z.contains(e.relatedTarget)){z.classList.remove("over");if(dragEl===z)dragEl=null}});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest("[data-drop]");if(!z){if(hasFiles(e)){e.preventDefault();toast("Solte os arquivos dentro da área de envio")}return}e.preventDefault();z.classList.remove("over");dragEl=null;const[k,id]=z.dataset.drop.split("|");addFiles(k,id,e.dataTransfer&&e.dataTransfer.files,catOf(z))});
document.addEventListener("change",e=>{const t=e.target;if(drawer&&(t.tagName==="SELECT"||t.type==="date")&&t.dataset.f){const ae=t.id;renderDrawer();const el=document.getElementById(ae);if(el)el.focus()}});
function refreshDrawerBits(){
  // update file names live without re-rendering inputs
  if(!drawer||drawer.kind!=="auto")return;
  document.querySelectorAll(".fname code").forEach((c,i)=>{const f=drawer.draft.fases[i];if(f)c.textContent=fileName(drawer.draft,f)});
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&drawer)closeDrawer()});

/* ---------- login ---------- */
let loginMsg="",loginMode="login";
function loginView(){
  if(loginMode==="nova") return '<div class="login"><div class="panel"><h2>Definir sua senha</h2><p class="sub">Escolha uma senha com pelo menos 8 caracteres para os próximos acessos.</p><form id="f-nova"><div class="field"><label for="l-nova">Nova senha</label><input type="password" id="l-nova" autocomplete="new-password" minlength="8" required></div>'+(loginMsg?'<p class="err">'+esc(loginMsg)+"</p>":"")+'<button class="btn primary" type="submit">Salvar senha</button></form></div></div>';
  return '<div class="login"><div class="panel"><div><h2>Entrar</h2><p class="sub">Acesso restrito à equipe do escritório.</p></div><form id="f-login"><div class="field"><label for="l-mail">E-mail</label><input type="email" id="l-mail" autocomplete="username" required></div><div class="field" style="margin-top:10px"><label for="l-pass">Senha</label><input type="password" id="l-pass" autocomplete="current-password" required></div>'+(loginMsg?'<p class="err">'+esc(loginMsg)+"</p>":"")+'<div class="meta" style="margin-top:12px"><button class="btn primary" type="submit">Entrar</button><button class="btn ghost sm" type="button" data-act="do-reset">Esqueci a senha</button></div></form></div></div>';
}
document.addEventListener("submit",async e=>{
  if(e.target.id==="f-login"){e.preventDefault();loginMsg="";const em=$("#l-mail").value.trim(),pw=$("#l-pass").value;
    const btn=e.target.querySelector("[type=submit]");btn.disabled=true;btn.textContent="Entrando…";
    const {error}=await sb.auth.signInWithPassword({email:em,password:pw});
    if(error){loginMsg=/invalid/i.test(error.message)?"E-mail ou senha incorretos.":error.message;render();const m=$("#l-mail");if(m)m.value=em}}
  if(e.target.id==="f-nova"){e.preventDefault();const {error}=await sb.auth.updateUser({password:$("#l-nova").value});if(error){loginMsg=error.message;render()}else{loginMode="login";loginMsg="";try{history.replaceState(null,"",location.pathname)}catch(_){}toast("Senha definida");start()}}
});
async function sendReset(){const m=$("#l-mail");const em=m&&m.value.trim();if(!em){loginMsg="Digite seu e-mail e clique de novo em Esqueci a senha.";render();return}
  const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});loginMsg=error?error.message:"Enviamos um link de redefinição para "+em+".";render();const n=$("#l-mail");if(n)n.value=em}

/* ---------- boot ---------- */
function start(){
  if(booted)return;booted=true;dbState="on";
  db=makeDb(sb);assets=makeAssets(sb);downloads=localDownloads;render();
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{const m=new Map();snap.docs.forEach(x=>{if(x.exists)m.set(x.id,Object.assign({id:x.id},x.data()))});S[c]=m;loaded.add(c);scheduleRender();if(drawer&&!drawer.isNew){}},
      err=>{loaded.add(c);scheduleRender();toast("Falha ao carregar "+c+": "+(err&&err.message||err.code))});
  });
}
(async()=>{
  if(!window.supabase||!CFG.url||!CFG.anonKey||/COLE/.test(CFG.url+CFG.anonKey)){dbState="config";render();return}
  if(/type=(invite|recovery)/.test(location.hash))loginMode="nova";
  sb=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,ses)=>{session=ses;
    if(ev==="PASSWORD_RECOVERY"||(ses&&loginMode==="nova")){loginMode="nova";dbState="login";render();return}
    if(ses&&loginMode!=="nova"){start()}
    if(!ses){booted=false;dbState="login";COLS.forEach(c=>S[c]=new Map());loaded.clear();try{sb.removeAllChannels()}catch(_){}closeDrawer();render()}
    else render();
  });
  const {data}=await sb.auth.getSession();session=data.session;if(!session){dbState="login";render()}
})();
setInterval(()=>{if(!drawer)scheduleRender()},60*60*1000);
})();
</script>
